[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digitrecognizer"
version = "0.1.0"
description = "A handwritten digit recognizer: model training, evaluation, CLI prediction, and a canvas-based web UI"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Abdulmalek Azouz" }]
keywords = ["machine-learning", "computer-vision", "scikit-learn", "classification"]

dependencies = [
    "scikit-learn>=1.3,<2",
    "numpy>=1.24,<3",
    "Pillow>=10.0,<12",
    "Flask>=3.0,<4",
    "joblib>=1.3,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
digitrecognizer = "digitrecognizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
digitrecognizer = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint.pydocstyle]
convention = "google"
